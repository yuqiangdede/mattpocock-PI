name: Document Skills Regression

on:
  pull_request:
    paths:
      - 'apps/desktop/resources/skills/**'
      - '.github/workflows/document-skills-tests.yml'
  push:
    branches: [main]
    paths:
      - 'apps/desktop/resources/skills/**'
      - '.github/workflows/document-skills-tests.yml'

permissions:
  contents: read

jobs:
  document-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Pandoc for real conversion smoke test (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pandoc
      - name: Install offline test dependencies
        run: python -m pip install python-docx Pillow
      - name: Shared document utilities
        run: python -m unittest discover -s apps/desktop/resources/skills/_shared/scripts -p "test_*.py" -v
      - name: Markdown to DOCX converters
        run: python -m unittest discover -s apps/desktop/resources/skills/markdown-to-docx/scripts -p "test_*.py" -v
