name: Sync PI upstream

on:
  workflow_dispatch:
    inputs:
      version:
        description: '官方稳定版本，例如 0.16.2'
        required: true
        type: string

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
      - name: 生成官方更新预览
        env:
          UPSTREAM_VERSION: ${{ inputs.version }}
        run: node scripts/update-upstream.mjs --version "$UPSTREAM_VERSION"
      - name: 保存预览报告和补丁
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-preview
          path: cache/upstream/
          if-no-files-found: ignore
